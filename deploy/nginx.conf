# nginx: /etc/nginx/sites-available/opunto-studio  (then link into sites-enabled)
# HTTPS: sudo certbot --nginx -d studio.opunto.ro
server {
    listen 80;
    server_name studio.opunto.ro;

    # photos up to 60 MB each
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AVIF encoding of a large photo takes a few seconds
        proxy_read_timeout 120s;
    }
}
